<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffe5f4" />
    <title>Just a simple tree · a procedural anime tree for three.js</title>
    <meta name="description" content="Grow a procedural, anime-style tree in your browser: oak, pine, cypress, weeping willow or bush, cel shaded and swaying in the wind. Tune it, then export it for three.js as a GLB, an impostor or a sprite sheet. Free, nothing to install." />
    <link rel="canonical" href="https://justasimpletree.com/" />

    <!-- The tab's icon, and the home screen's on iPhone and Android -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Simple tree" />

    <!-- The card a shared link shows (Open Graph for most apps, Twitter's own
         tags for X). Their addresses must be absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Just a simple tree" />
    <meta property="og:title" content="Just a simple tree" />
    <meta property="og:description" content="A procedural, anime-style tree to grow in your browser and export for three.js." />
    <meta property="og:url" content="https://justasimpletree.com/" />
    <meta property="og:image" content="https://justasimpletree.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pink cel-shaded tree in blossom on a tuft of grass, beside the words just a simple tree" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Just a simple tree" />
    <meta name="twitter:description" content="A procedural, anime-style tree to grow in your browser and export for three.js." />
    <meta name="twitter:image" content="https://justasimpletree.com/og-image.png" />
    <meta name="twitter:image:alt" content="A pink cel-shaded tree in blossom on a tuft of grass, beside the words just a simple tree" />

    <!-- What the page is, for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Just a simple tree",
        "url": "https://justasimpletree.com/",
        "image": "https://justasimpletree.com/og-image.png",
        "description": "A procedural, anime-style tree for three.js, to tune in the browser and export as a GLB, an impostor or a sprite sheet.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires WebGPU or WebGL2",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "codeRepository": "https://github.com/MikeFernandez-Pro/just-a-simple-tree"
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe5f4; }
      canvas { display: block; }
      /* The buttons' hard shadow: a soft charcoal, black on a dark background */
      :root { --button-shadow: #46434d; }
      :root.dark { --button-shadow: #000; }

      /* The loader, there from the first paint until the tree's first frames
         are drawn: a white sticker like the buttons, a sapling sprouting in
         it over and over, on the page's own background. Once they are, the
         sapling stands grown and the sticker pops into an enter button,
         pressed in like the others when clicked */
      #loader { position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center;
        background: inherit; transition: opacity .35s }
      #loader.done { opacity: 0; pointer-events: none }
      #loader .card { position: relative; display: flex; align-items: center; gap: 14px; padding: 13px 24px 13px 18px;
        border: 3px solid #46434d; border-radius: 10px; background: #fff; box-shadow: 5px 5px 0 var(--button-shadow);
        font: 700 16px/1.2 monospace; letter-spacing: .02em; color: #2b2a30; transform: rotate(-2deg);
        cursor: default; transition: box-shadow .08s, translate .08s }
      #loader .enter { display: none }
      #loader.ready .growing { display: none }
      #loader.ready .enter { display: inline }
      #loader.ready .card { cursor: pointer; animation: loader-pop .45s cubic-bezier(.34, 1.8, .64, 1) }
      #loader.ready .card:hover { box-shadow: 7px 7px 0 var(--button-shadow) }
      #loader.ready .card:active { box-shadow: 1px 1px 0 var(--button-shadow); translate: 4px 4px }
      #loader.ready .stem, #loader.ready .leaf { animation: none; stroke-dashoffset: 0; scale: 1 }
      @keyframes loader-pop { from { scale: .8 } to { scale: 1 } }
      /* Opening, the cover drawn by reveal.js, and the sticker popping away */
      #loader.opening { pointer-events: none }
      #loader .cover { position: absolute; inset: 0; width: 100%; height: 100% }
      #loader.opening .card { scale: 0; opacity: 0;
        transition: scale .3s cubic-bezier(.36, -0.6, .7, 1), opacity .3s .1s }
      #loader svg { width: 42px; height: 42px; overflow: visible }
      #loader .stem { stroke-dasharray: 10; animation: loader-stem 1.8s cubic-bezier(.5, 0, .3, 1) infinite }
      #loader .leaf { transform-box: fill-box; scale: 0; animation: loader-leaf 1.8s cubic-bezier(.34, 1.8, .64, 1) infinite }
      #loader .left { transform-origin: 100% 100% }
      #loader .right { transform-origin: 0 100%; animation-delay: .12s }
      #loader .dots span { animation: loader-dot 1.2s steps(1) infinite }
      #loader .dots span:nth-child(2) { animation-delay: .2s }
      #loader .dots span:nth-child(3) { animation-delay: .4s }
      @keyframes loader-stem { 0% { stroke-dashoffset: 10 } 30%, 85% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -10 } }
      @keyframes loader-leaf { 0%, 25% { scale: 0 } 45%, 80% { scale: 1 } 95%, 100% { scale: 0 } }
      @keyframes loader-dot { 0% { opacity: 0 } 40% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        #loader .stem, #loader .leaf, #loader .dots span { animation: none; stroke-dashoffset: 0; scale: 1; opacity: 1 }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="growing a tree">
      <button class="card" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2b2a30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 21h14" />
          <path class="stem" d="M12 21v-10" />
          <path class="leaf left" d="M12 15c-4.2 0-6.5-2.6-6.5-6.2 4.2 0 6.5 2.6 6.5 6.2z" fill="#8fd16a" />
          <path class="leaf right" d="M12 12.5c0-3.8 2.2-6.5 6.3-6.5 0 3.8-2.2 6.5-6.3 6.5z" fill="#c4ec84" />
        </svg>
        <span class="growing">growing a tree<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>
        <span class="enter">enter</span>
      </button>
    </div>
    <!-- For readers and crawlers without JavaScript, as the page is otherwise a canvas -->
    <noscript>
      <style>#loader { display: none } body { padding: 24px; font: 16px/1.5 monospace; color: #2b2a30 }</style>
      <h1>Just a simple tree</h1>
      <p>A procedural, anime-style tree for three.js, to tune in the browser and export as a GLB, an impostor or a
        sprite sheet. Five species grow from a seed: oak, pine, cypress, weeping willow and bush. It needs JavaScript
        and WebGPU or WebGL2.</p>
      <p><a href="https://github.com/MikeFernandez-Pro/just-a-simple-tree">The code on GitHub</a></p>
    </noscript>
    <script type="module" src="/main.js"></script>
  </body>
</html>
