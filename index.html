<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffe5f4" />
    <title>Just a simple tree</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe5f4; }
      canvas { display: block; }
      /* The buttons' hard shadow: a soft charcoal, black on a dark background */
      :root { --button-shadow: #46434d; }
      :root.dark { --button-shadow: #000; }

      /* The loader, there from the first paint until the tree's first frames
         are drawn: a white sticker like the buttons, a sapling sprouting in
         it over and over, on the page's own background */
      #loader { position: fixed; inset: 0; z-index: 20000; display: grid; place-items: center;
        background: inherit; transition: opacity .35s }
      #loader.done { opacity: 0; pointer-events: none }
      /* Opening, the cover drawn by reveal.js, and the sticker popping away */
      #loader.opening { pointer-events: none }
      #loader .cover { position: absolute; inset: 0; width: 100%; height: 100% }
      #loader.opening .card { scale: 0; opacity: 0;
        transition: scale .3s cubic-bezier(.36, -0.6, .7, 1), opacity .3s .1s }
      #loader .card { position: relative; display: flex; align-items: center; gap: 14px; padding: 13px 24px 13px 18px;
        border: 3px solid #46434d; border-radius: 10px; background: #fff; box-shadow: 5px 5px 0 var(--button-shadow);
        font: 700 16px/1.2 monospace; letter-spacing: .02em; color: #2b2a30; transform: rotate(-2deg) }
      #loader svg { width: 42px; height: 42px; overflow: visible }
      #loader .stem { stroke-dasharray: 10; animation: loader-stem 1.8s cubic-bezier(.5, 0, .3, 1) infinite }
      #loader .leaf { transform-box: fill-box; scale: 0; animation: loader-leaf 1.8s cubic-bezier(.34, 1.8, .64, 1) infinite }
      #loader .left { transform-origin: 100% 100% }
      #loader .right { transform-origin: 0 100%; animation-delay: .12s }
      #loader .dots span { animation: loader-dot 1.2s steps(1) infinite }
      #loader .dots span:nth-child(2) { animation-delay: .2s }
      #loader .dots span:nth-child(3) { animation-delay: .4s }
      @keyframes loader-stem { 0% { stroke-dashoffset: 10 } 30%, 85% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -10 } }
      @keyframes loader-leaf { 0%, 25% { scale: 0 } 45%, 80% { scale: 1 } 95%, 100% { scale: 0 } }
      @keyframes loader-dot { 0% { opacity: 0 } 40% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        #loader .stem, #loader .leaf, #loader .dots span { animation: none; stroke-dashoffset: 0; scale: 1; opacity: 1 }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="growing a tree">
      <div class="card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2b2a30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 21h14" />
          <path class="stem" d="M12 21v-10" />
          <path class="leaf left" d="M12 15c-4.2 0-6.5-2.6-6.5-6.2 4.2 0 6.5 2.6 6.5 6.2z" fill="#8fd16a" />
          <path class="leaf right" d="M12 12.5c0-3.8 2.2-6.5 6.3-6.5 0 3.8-2.2 6.5-6.3 6.5z" fill="#c4ec84" />
        </svg>
        <span>growing a tree<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
